services:
  redis:
    image: redis:latest
    container_name: homemate-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - homemate-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homemate-backend
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:mysql://host.docker.internal:3306/HomeMate?createDatabaseIfNotExist=TRUE&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-${DB_PASSWORD}}

      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}

      SPRING_FLYWAY_ENABLED: 'true'
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: 'true'

      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-${HomeMateMail}}
      APP_SECURITY_ENABLED: 'true'

      # Use environment variables for OAuth
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

    depends_on:
      - redis
    networks:
      - homemate-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  homemate-network:
    driver: bridge