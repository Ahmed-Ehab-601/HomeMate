spring.application.name=HomeMate

spring.datasource.url=jdbc:h2:mem:db_taskerprofile;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false

# Initialize schema and data for tasker profile tests
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.schema-locations=classpath:taskerProfileSchema.sql
spring.sql.init.data-locations=classpath:taskerProfileData.sql
