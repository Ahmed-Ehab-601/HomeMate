# Test Configuration - Uses H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:test-data.sql

# Disable security for easier testing (or configure test security)
# spring.security.enabled=false

# Logging
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.homemate=DEBUG


