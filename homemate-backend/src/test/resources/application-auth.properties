spring.application.name=HomeMate

# H2 In-Memory Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:db_auth;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
# Initialize schema and data
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.schema-locations=classpath:taskerschema.sql
spring.sql.init.data-locations=

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration

# OAuth2 properties (dummy values for testing - required by GoogleTokenVerifierService)
spring.security.oauth2.client.registration.google.client-id=test-client-id

