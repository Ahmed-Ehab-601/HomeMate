spring.application.name=HomeMate-reports-test

spring.datasource.url=jdbc:h2:mem:db_reports;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false

# Use reports test schema/data
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:reportsSchema.sql
spring.sql.init.data-locations=classpath:reportsData.sql

spring.jpa.hibernate.ddl-auto=none

# Reduce noise in test logs
logging.level.org.flywaydb=INFO
logging.level.org.springframework.jdbc.core=INFO
