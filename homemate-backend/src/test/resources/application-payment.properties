spring.application.name=HomeMate

# H2 In-Memory Database Configuration for Payment Tests
spring.datasource.url=jdbc:h2:mem:paymentdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# IMPORTANT: Disable Hibernate DDL since we're using SQL scripts
spring.jpa.hibernate.ddl-auto=none

# Disable Flyway for tests
spring.flyway.enabled=false

# Initialize schema and data with SQL scripts
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:paymentSchema.sql
spring.sql.init.data-locations=classpath:paymentData.sql

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration

# OAuth2 properties (dummy values for testing)
spring.security.oauth2.client.registration.google.client-id=test-client-id