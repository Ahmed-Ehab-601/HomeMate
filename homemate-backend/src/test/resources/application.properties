spring.application.name=HomeMate-test-default

# Default in-memory DB for tests that don't set a profile
spring.datasource.url=jdbc:h2:mem:homemate_default;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway for unit/integration tests unless explicitly enabled by a profile
spring.flyway.enabled=false

# Avoid automatic SQL init unless a profile/test sets schema/data
spring.sql.init.mode=never

# Prevent Hibernate from creating/updating schema unless a profile requests it
spring.jpa.hibernate.ddl-auto=none

# Reduce log noise during tests
logging.level.org.flywaydb=INFO
logging.level.org.springframework.jdbc.core=INFO

# Dummy OAuth2 client id to satisfy GoogleTokenVerifierService during tests
spring.security.oauth2.client.registration.google.client-id=test-client-id

stripe.secret.key=test-secret-key