spring.application.name=HomeMate

# MySQL Test Data Source Configuration
# Separate test database to avoid affecting production data
spring.datasource.url=jdbc:mysql://localhost:3306/HomeMatetest?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=mohamed
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Initialize schema for tests (data is inserted manually in test setup)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=

# JPA/Hibernate settings for tests
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

