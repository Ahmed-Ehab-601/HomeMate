spring.application.name=HomeMate

# MySQL Data Source Configuration
# Used to create DataSource connection bean
spring.datasource.url=jdbc:mysql://localhost:3306/HomeMate?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# instead of always could use never to not recreate the tables
spring.sql.init.mode=always

