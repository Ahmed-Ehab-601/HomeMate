spring.application.name=HomeMate
service.port=8080
# MySQL Data Source Configuration
# Used to create DataSource connection bean
spring.datasource.url=jdbc:mysql://localhost:3306/HomeMate?createDatabaseIfNotExist=TRUE&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Africa/Cairo
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# instead of always could use never to not recreate the tables
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0
spring.flyway.schemas=HomeMate

# Security Configuration
app.security.enabled=true

#spring.security.user.name=admin
#spring.security.user.password=admin123

spring.security.oauth2.client.registration.google.client-id=953966255991-698hogtjc70cori6r61dbjqhk30dq44u.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Disable Spring Boot's automatic Docker Compose management
spring.docker.compose.enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=homemateservice8@gmail.com
spring.mail.password=${HomeMateMail}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
