spring.application.name=HomeMate
service.port=8080
# MySQL Data Source Configuration
# Used to create DataSource connection bean
spring.datasource.url=jdbc:mysql://localhost:3306/HomeMate?createDatabaseIfNotExist=TRUE&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# instead of always could use never to not recreate the tables
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0
spring.flyway.schemas=HomeMate

